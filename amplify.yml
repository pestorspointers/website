# AWS Amplify build settings.
#
# A committed amplify.yml overrides whatever the console auto-detected. Amplify
# was picking pnpm off the root pnpm-lock.yaml (which only covers the local
# AWS-SDK tooling) and failing with "pnpm: command not found" — the deployable
# app is client/, and it uses npm.
#
# Note: the build shell keeps its working directory between phases, so a `cd`
# in preBuild would leak into build. `--prefix` keeps every command independent
# of where the shell happens to be.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm --prefix client ci
    build:
      commands:
        - npm --prefix client run build
  artifacts:
    baseDirectory: client/.next
    files:
      - '**/*'
  cache:
    paths:
      - client/node_modules/**/*
      - client/.next/cache/**/*
