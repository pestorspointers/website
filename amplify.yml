# AWS Amplify build settings.
#
# This builds the whole product. The site, the admin area and the API all live
# in client/ — the API as Next route handlers under /api/v1 — so this one
# application block is the entire deployment. There is no second service.
#
# The deployable app is client/, not the repo root. Amplify's native Next.js SSR
# support keys off the app root's package.json, so the app root has to be
# client/ — otherwise it finds no `next` dependency, skips the Next adapter, and
# the deploy fails looking for a deploy-manifest.json we never produce.
#
# This `applications:`/`appRoot:` format is Amplify's monorepo layout. It pairs
# with the AMPLIFY_MONOREPO_APP_ROOT=client environment variable on the app —
# both must be set, or the build won't match an application block. Amplify cds
# into appRoot itself, so the commands below are plain npm.
version: 1
applications:
  - appRoot: client
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            # Amplify hands console environment variables to the BUILD, not to
            # the server that runs afterwards. Anything with a NEXT_PUBLIC_
            # prefix survives regardless, because Next compiles those values
            # into the bundle — which is why the public pages worked while
            # every route needing the service-role key returned a 500.
            #
            # Writing them into .env.production is AWS's documented fix: Next
            # loads that file at runtime, so the API gets its secrets. Add any
            # new server-side variable to this list or it will be missing in
            # production and present everywhere else.
            - >-
              env | grep -E
              '^(SUPABASE_SECRET_KEY|SUPABASE_SERVICE_ROLE_KEY|SUPABASE_JWT_SECRET|STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET|APP_AWS_REGION|APP_AWS_ACCESS_KEY_ID|APP_AWS_SECRET_ACCESS_KEY|S3_BUCKET_NAME|CLOUDFRONT_DOMAIN|CLOUDFRONT_KEY_PAIR_ID|CLOUDFRONT_PRIVATE_KEY|MEDIACONVERT_ENDPOINT|MEDIACONVERT_ROLE_ARN)='
              >> .env.production || echo 'no server-side variables matched'
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
